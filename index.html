<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pugsley // archived</title>
    <style>
        :root {
            --bg-canvas: #080a0f;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Ambient Canvas Background Rain */
        .rain-matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        .rain-drop {
            background: linear-gradient(transparent, rgba(88, 166, 255, 0.15));
            width: 1px;
            height: 40px;
            position: absolute;
            top: -40px;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            0% { transform: translateY(0); }
            100% { transform: translateY(105vh); }
        }

        /* Fullscreen Archive Message Wrapper */
        .archive-wrapper {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .archive-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--text-primary);
            letter-spacing: -0.2px;
            margin: 0;
        }

        .archive-signoff {
            display: block;
            margin-top: 20px;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, monospace;
            color: var(--text-secondary);
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    
    <div class="rain-matrix" id="rainContainer"></div>

    <div class="archive-wrapper">
        <p class="archive-text">
            this website and all of its entirety has been archived, since people i know irl have found it. and i dont wanna cause drama so i just archived it.
            <span class="archive-signoff">- pugsley</span>
        </p>
    </div>

    <script>
        // --- AMBIENT RAIN ENGINE ---
        const rainContainer = document.getElementById('rainContainer');
        const dropCount = 75;

        for (let i = 0; i < dropCount; i++) {
            const drop = document.createElement('div');
            drop.classList.add('rain-drop');
            drop.style.left = Math.random() * 100 + 'vw';
            drop.style.animationDuration = Math.random() * 0.7 + 0.9 + 's'; 
            drop.style.animationDelay = Math.random() * 2 + 's';
            rainContainer.appendChild(drop);
        }
    </script>
</body>
</html>
