<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pugsley | bio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e17;
    --surface: #111827;
    --card: #1a2235;
    --border: rgba(255,255,255,.06);
    --border-hover: rgba(99,102,241,.4);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --dim: #64748b;
    --accent: #6366f1;
    --accent-glow: rgba(99,102,241,.25);
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --discord: #5865f2;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  code, .mono { font-family: 'JetBrains Mono', monospace; }

  /* Background gradient orbs */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 600px 400px at 20% 10%, rgba(99,102,241,.08), transparent),
      radial-gradient(ellipse 500px 500px at 80% 80%, rgba(16,185,129,.05), transparent),
      radial-gradient(ellipse 400px 300px at 60% 30%, rgba(236,72,153,.04), transparent);
    pointer-events: none;
  }

  /* ===== RAIN CANVAS ===== */
  #rainCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: .4;
  }

  /* ===== INTRO ===== */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity .7s ease, transform .7s ease;
  }
  #intro.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }

  .intro-logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2.2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 24px;
  }
  .intro-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: .9rem;
    color: var(--dim);
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

  .intro-key {
    margin-top: 40px;
    padding: 12px 28px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'JetBrains Mono', monospace;
    font-size: .82rem;
    color: var(--muted);
    background: rgba(255,255,255,.02);
    backdrop-filter: blur(10px);
  }

  .intro-scan {
    position: absolute;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: .5;
    animation: scan 3s linear infinite;
  }
  @keyframes scan { 0%{top:0} 100%{top:100%} }

  /* ===== MAIN ===== */
  #main {
    opacity: 0;
    transition: opacity .5s ease .2s;
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 24px 64px;
    position: relative;
    z-index: 1;
  }
  #main.show { opacity: 1; }

  /* Profile Header */
  .profile-header {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .avatar-wrap { position: relative; flex-shrink: 0; }

  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid var(--border);
    object-fit: cover;
    background: var(--card);
    box-shadow: 0 0 0 4px var(--bg), 0 8px 32px rgba(0,0,0,.4);
  }

  .status-ring {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border: 2.5px solid var(--border);
    transition: border-color .3s;
  }

  .profile-info { flex: 1; min-width: 200px; }

  .profile-name {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .profile-name .handle {
    color: var(--dim);
    font-weight: 400;
    font-size: 1rem;
    margin-left: 6px;
  }

  .profile-bio {
    color: var(--muted);
    margin-top: 8px;
    font-size: .9rem;
    line-height: 1.6;
  }

  .profile-meta {
    display: flex;
    gap: 12px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .meta-item {
    font-size: .8rem;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: .75rem;
    font-weight: 600;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.02);
    transition: all .3s;
  }

  /* Error toast */
  .error-toast {
    display: none;
    background: rgba(239,68,68,.08);
    border: 1px solid rgba(239,68,68,.3);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: .82rem;
    color: var(--red);
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
  }
  .error-toast.show { display: block; animation: slideIn .3s ease; }
  @keyframes slideIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

  /* Spotify */
  .spotify-card {
    background: linear-gradient(135deg, rgba(16,185,129,.12) 0%, var(--surface) 60%);
    border: 1px solid rgba(16,185,129,.2);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 24px;
    display: none;
    backdrop-filter: blur(10px);
  }
  .spotify-card.show { display: block; animation: slideIn .3s ease; }

  .spotify-label {
    font-size: .7rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .spotify-song { font-weight: 600; font-size: .95rem; }
  .spotify-artist { font-size: .82rem; color: var(--muted); margin-top: 3px; }

  .spotify-bar {
    height: 3px;
    background: rgba(255,255,255,.06);
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
  }
  .spotify-bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    animation: progress 30s linear infinite;
  }
  @keyframes progress { 0%{width:0%} 100%{width:100%} }

  /* Section titles */
  .section-title {
    font-size: .8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--dim);
    margin: 32px 0 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .section-title .count { color: var(--dim); font-weight: 400; }

  /* Cards Grid */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    text-decoration: none;
    color: var(--text);
    transition: all .25s ease;
    display: block;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(99,102,241,.05), transparent);
    opacity: 0;
    transition: opacity .25s;
  }
  .card:hover {
    border-color: var(--border-hover);
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0,0,0,.3), 0 0 0 1px var(--accent-glow);
  }
  .card:hover::before { opacity: 1; }

  .card-name {
    font-weight: 600;
    font-size: .92rem;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-desc {
    font-size: .82rem;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 14px;
    min-height: 2.4em;
  }
  .card-footer {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: .75rem;
    color: var(--dim);
  }
  .card-lang { display: flex; align-items: center; gap: 5px; }
  .card-lang .dot { width: 8px; height: 8px; border-radius: 50%; }
  .card-stars { display: flex; align-items: center; gap: 4px; }
  .card-badge {
    margin-left: auto;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: .68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    border: 1px solid;
  }
  .badge-discord { color: var(--discord); border-color: rgba(88,101,242,.4); background: rgba(88,101,242,.08); }
  .badge-ttk { color: var(--text); border-color: var(--border); background: rgba(255,255,255,.04); }
  .badge-github { color: var(--green); border-color: rgba(16,185,129,.4); background: rgba(16,185,129,.08); }

  /* README */
  .readme {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 32px;
    line-height: 1.8;
    font-size: .9rem;
  }
  .readme h1 {
    font-size: 1.3rem;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
  }
  .readme h2 {
    font-size: 1rem;
    margin: 18px 0 10px;
    color: var(--accent);
    font-weight: 600;
  }
  .readme p { margin-bottom: 10px; color: var(--muted); }
  .readme ul { margin: 8px 0 14px 20px; color: var(--muted); }
  .readme li { margin-bottom: 5px; }
  .readme code {
    background: rgba(255,255,255,.05);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: .8rem;
    border: 1px solid var(--border);
  }
  .readme a { color: var(--accent); text-decoration: none; }
  .readme a:hover { text-decoration: underline; }
  .readme .badge-inline {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: .72rem;
    font-weight: 600;
    border: 1px solid;
    margin-right: 6px;
  }

  /* Footer */
  .footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: .78rem;
    color: var(--dim);
    text-align: center;
    letter-spacing: .3px;
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(0,0,0,.7);
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
  }
  .modal-overlay.show { display: flex; }

  .modal {
    position: relative;
    width: 90%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px 28px;
    text-align: center;
    box-shadow: 0 24px 80px rgba(0,0,0,.6), 0 0 0 1px var(--accent-glow);
    animation: modalIn .35s cubic-bezier(.16,1,.3,1);
  }
  @keyframes modalIn {
    0% { opacity: 0; transform: scale(.92) translateY(16px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 30px;
    height: 30px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--dim);
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .2s;
  }
  .modal-close:hover { background: rgba(255,255,255,.1); color: var(--text); transform: rotate(90deg); }

  .modal-icon { font-size: 2.2rem; margin-bottom: 14px; display: block; }
  .modal-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
  .modal-sub { font-size: .82rem; color: var(--muted); margin-bottom: 24px; }

  /* Customizable username input */
  .username-field {
    margin-bottom: 16px;
  }
  .username-field label {
    display: block;
    font-size: .72rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: 600;
    text-align: left;
  }
  .username-input-wrap {
    display: flex;
    gap: 8px;
  }
  .username-input {
    flex: 1;
    padding: 12px 14px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: .9rem;
    font-weight: 600;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .username-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .username-input::placeholder { color: var(--dim); }

  .copy-btn {
    padding: 12px 18px;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    font-size: .82rem;
    font-weight: 600;
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .copy-btn:hover { background: #4f46e5; transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }
  .copy-btn:active { transform: scale(.96); }
  .copy-btn.copied { background: var(--green); }

  .modal-invite {
    display: inline-block;
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    background: rgba(255,255,255,.03);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: .8rem;
    text-decoration: none;
    transition: all .2s;
  }
  .modal-invite:hover { background: rgba(255,255,255,.07); color: var(--text); border-color: rgba(255,255,255,.15); }

  /* Responsive */
  @media (max-width: 600px) {
    .profile-header { gap: 18px; }
    .avatar { width: 80px; height: 80px; }
    .profile-name { font-size: 1.3rem; }
    .readme { padding: 20px; }
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

<!-- INTRO -->

<!-- MAIN -->
<div id="main">

  <div class="error-toast" id="errorToast"></div>

  <div class="profile-header">
    <div class="avatar-wrap">
      <img id="avatar" class="avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%231a2235' width='100' height='100' rx='50'/%3E%3Ctext x='50' y='55' text-anchor='middle' fill='%2364748b' font-size='36' font-family='sans-serif'%3E%3C/text%3E%3C/svg%3E" alt="avatar">
      <div id="statusRing" class="status-ring">

  <div id="spotifyCard" class="spotify-card">

    <div class="spotify-artist" id="artist">—</div>

  <div class="section-title">About <span class="count"></span></div>

<script>
// ==================== RAIN ====================
const canvas = document.getElementById('rainCanvas');
const ctx = canvas.getContext('2d');
let W, H;
const drops = [];
const DROP_COUNT = 100;
const WIND = 0.3;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Drop {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * (W + 100) - 50;
    this.y = Math.random() * -H;
    this.len = 12 + Math.random() * 20;
    this.speed = 6 + Math.random() * 10;
    this.opacity = 0.08 + Math.random() * 0.2;
  }
  update() {
    this.y += this.speed;
    this.x += WIND;
    if (this.y > H + this.len) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + WIND * 2, this.y + this.len);
    ctx.strokeStyle = `rgba(148,163,184,${this.opacity})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

for (let i = 0; i < DROP_COUNT; i++) drops.push(new Drop());

(function animate() {
  ctx.clearRect(0, 0, W, H);
  drops.forEach(d => { d.update(); d.draw(); });
  requestAnimationFrame(animate);
})();

// ==================== CONFIG ====================
const DISCORD_ID = "1486666866826018848";
const DEFAULT_DISCORD_USERNAME = "pugsley.tech";

const LINKS = [
  { name: "Discord",  desc: "This is how to reach me (basically or my TikTok)", url: "https://discord.gg/778P5gDtEp", lang: "Discord", color: "#5865f2", badge: "discord", stars: 128, modal: true },
  { name: "TikTok",   desc: "I post random shit (don't judge me)", url: "https://www.tiktok.com/@jakeisnthereanymore", lang: "TikTok", color: "#010101", badge: "ttk", stars: 64 },
  { name: "GitHub",   desc: "Code I've written for fun", url: "https://github.com/pugsleydebug", lang: "TypeScript", color: "#3178c6", badge: "github", stars: 256 },
];

const README_HTML = `
  <h1>Hey, I'm <strong>pugsley!</strong></h1>
  <p>A developer / gamer / creator based on <strong>Earth</strong>. I build cool stuff and break it afterwards.</p>

  <h2>🛠️ What I do</h2>
  <ul>
    <li>Developing (HTML, Python, and such)</li>
    <li>Game dev (Unity, Roblox)</li>
    <li>Open source contributions</li>
  </ul>

  <h2>📊 Fun facts</h2>
  <ul>
    <li>I've been coding since <code>2021</code></li>
    <li>Favorite language: <code>Lua</code></li>
    <li>Coffee consumed this week: <code>∞</code></li>
  </ul>

  <h2>🔗 Elsewhere</h2>
  <p>
    <span class="badge-inline" style="color:#5865f2;border-color:rgba(88,101,242,.4);background:rgba(88,101,242,.08)">Discord</span>
    <span class="badge-inline" style="color:#10b981;border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08)">GitHub</span>
  </p>

  <p style="color:var(--dim);font-size:.8rem;margin-top:18px;">
    This profile is a single HTML file. View source to customize. 🤓
  </p>
`;

// ==================== INTRO ====================
const intro = document.getElementById('intro');
const main = document.getElementById('main');

function enter() {
  if (intro.classList.contains('hide')) return;
  intro.classList.add('hide');
  main.classList.add('show');
  setTimeout(() => intro.remove(), 800);
}
document.addEventListener('keydown', enter);
intro.addEventListener('click', enter);

// ==================== MODAL ====================
const modal = document.getElementById('discordModal');

function openModal() {
  modal.classList.add('show');
  // Focus the input so user can immediately edit
  setTimeout(() => document.getElementById('discordUsername').select(), 100);
}
function closeModal() { modal.classList.remove('show'); }

modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ==================== COPY ====================
function copyUsername() {
  const value = document.getElementById('discordUsername').value.trim();
  if (!value) return;

  navigator.clipboard.writeText(value).then(() => {
    const btn = document.getElementById('copyBtn');
    const icon = document.getElementById('copyIcon');
    const text = document.getElementById('copyText');
    btn.classList.add('copied');
    icon.textContent = '✓';
    text.textContent = 'Copied!';
    setTimeout(() => {
      btn.classList.remove('copied');
      icon.textContent = '📋';
      text.textContent = 'Copy';
    }, 2000);
  });
}

// Allow Enter key in input to copy
document.getElementById('discordUsername').addEventListener('keydown', e => {
  if (e.key === 'Enter') copyUsername();
});

// ==================== RENDER LINKS ====================
const grid = document.getElementById('cardsGrid');

LINKS.forEach(l => {
  const el = document.createElement(l.modal ? 'div' : 'a');
  el.className = 'card';
  if (l.modal) {
    el.style.cursor = 'pointer';
    el.onclick = openModal;
  } else {
    el.href = l.url;
    el.target = '_blank';
  }
  el.innerHTML = `
    <div class="card-name">${l.name}</div>
    <div class="card-desc">${l.desc}</div>
    <div class="card-footer">
      <span class="card-lang"><span class="dot" style="background:${l.color}"></span>${l.lang}</span>
      <span class="card-stars">⭐ ${l.stars}</span>
      <span class="card-badge badge-${l.badge}">${l.badge}</span>
    </div>`;
  grid.appendChild(el);
});

document.getElementById('linkCount').textContent = `(${LINKS.length})`;

// ==================== README ====================
document.getElementById('readme').innerHTML = README_HTML;

// ==================== DISCORD STATUS ====================
const statusIcons = {
  online:  `<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#10b981"/></svg>`,
  idle:    `<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#f59e0b"/><path d="M12 6a6 6 0 100 12 6 6 0 000-12zm0 10a4 4 0 01-4-4 4 4 0 014-4v8z" fill="#0a0e17"/></svg>`,
  dnd:     `<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#ef4444"/><rect x="7" y="11" width="10" height="2" rx="1" fill="#fff"/></svg>`,
  offline: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#64748b"/></svg>`,
};

const statusMap = {
  online:  { label: "Online",  color: "#10b981" },
  idle:    { label: "Idle",    color: "#f59e0b" },
  dnd:     { label: "DND",     color: "#ef4444" },
  offline: { label: "Offline", color: "#64748b" },
};

function showError(msg) {
  const t = document.getElementById('errorToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 8000);
}

async function fetchStatus() {
  try {
    const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();

    if (!json.success || !json.data) {
      showError("⚠️ Lanyard can't find this user. Make sure you've joined the Lanyard Discord server (discord.gg/lanyard).");
      return;
    }

    const d = json.data;

    const avId = d.discord_user?.avatar;
    if (avId) {
      document.getElementById('avatar').src =
        `https://cdn.discordapp.com/avatars/${d.discord_user.id}/${avId}.png?size=256`;
    }

    const name = d.discord_user?.global_name || d.discord_user?.username || 'unknown';
    document.getElementById('displayName').innerHTML =
      `${name}<span class="handle">@${d.discord_user?.username || 'user'}</span>`;

    const st = statusMap[d.discord_status] || statusMap.offline;
    const icon = statusIcons[d.discord_status] || statusIcons.offline;

    const ring = document.getElementById('statusRing');
    ring.innerHTML = icon;
    ring.style.borderColor = st.color;

    const badge = document.getElementById('statusBadge');
    badge.innerHTML = `${icon} ${st.label}`;
    badge.style.borderColor = st.color + '44';
    badge.style.color = st.color;

    document.getElementById('bio').textContent =
      d.discord_user?.bio || `Currently ${st.label.toLowerCase()} on Discord.`;

    if (d.listening_to_spotify && d.spotify) {
      document.getElementById('song').textContent = d.spotify.song;
      document.getElementById('artist').textContent = d.spotify.artist;
      document.getElementById('spotifyCard').classList.add('show');
      document.getElementById('spotifyMeta').style.display = '';
    } else {
      document.getElementById('spotifyCard').classList.remove('show');
      document.getElementById('spotifyMeta').style.display = 'none';
    }
  } catch (e) {
    showError(`⚠️ Lanyard fetch failed: ${e.message}`);
  }
}

fetchStatus();
setInterval(fetchStatus, 15000);
</script>
