<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Birthday Ren!! :D</title>
    <style>
        :root { --pink: #ff71ce; }
        body { margin: 0; background: #050505; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        #overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.5s; font-family: 'Courier New', monospace; text-transform: uppercase; letter-spacing: 5px; font-weight: bold; color: var(--pink); text-shadow: 0 0 15px var(--pink); }

        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 40px; width: 400px; text-align: left; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border-top: 1px solid rgba(255,255,255,0.2); }
        
        #text-display { font-size: 1rem; color: #eee; line-height: 1.6; min-height: 200px; white-space: pre-wrap; }
        .cursor { border-right: 2px solid var(--pink); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="overlay" onclick="start()">click to open your gift</div>

    <div class="glass-card">
        <div id="text-display"><span class="cursor"></span></div>
    </div>

    <!-- Mechanical keyboard sound -->
    <audio id="type-sound"><source src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3" type="audio/mpeg"></audio>

    <script>
        const fullText = `Happy Birthday Ren!

You are the bright spot in my ordinary days and the person who makes every moment feel like a beautiful story. I am so lucky to celebrate you today.

May your year ahead be filled with everything you dream of, and please always remember that you have a home in my heart.

Happy birthday, my love. I’m so happy for you <3`;

        const display = document.getElementById('text-display');
        const sound = document.getElementById('type-sound');

        function start() {
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('overlay').style.display = 'none', 500);
            typeWriter(0);
        }

        async function typeWriter(i) {
            if (i < fullText.length) {
                // Update text
                display.innerHTML = fullText.substring(0, i + 1) + '<span class="cursor"></span>';
                
                // Play sound
                sound.currentTime = 0;
                sound.play();

                // Random typing speed for realism
                let speed = Math.random() * 50 + 50; 
                setTimeout(() => typeWriter(i + 1), speed);
            }
        }
    </script>
</body>
</html>
